name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The background runtime and its tests are Windows-only.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == 'v' + version, f'Tag {tag} does not match package version {version}'
      - run: .\gradlew.bat build --console=plain
      # Writes bin/<minecraft>/bridge.json from gradle.properties, with hashes from the Modrinth API.
      - run: python scripts/stage_bridges.py
      - run: python -m unittest discover -s tests -v
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the installed wheel
        run: |
          python -m venv smoke
          smoke\Scripts\python -m pip install (Get-Item dist\*.whl).FullName
          smoke\Scripts\flashback-clips capabilities
          smoke\Scripts\python -I -c "from flashback_agent.install import skill_source; p = skill_source(); assert 'site-packages' in str(p), p; print(p)"
          smoke\Scripts\python -I -c "from flashback_agent import bridges; assert bridges.supported() and bridges.GUARD.is_file(); print(bridges.supported())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no API token is stored in the repository.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
